<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--paper:{{BACKGROUND}};--ink:{{INK}};--accent:{{ACCENT}};--display:{{DISPLAY_FONT}};--body:{{BODY_FONT}};--w:1080px;--h:1080px}*{box-sizing:border-box}html,body{margin:0;width:var(--w);height:var(--h);overflow:hidden}body{background:var(--paper);color:var(--ink);font-family:var(--body),Arial,sans-serif}.canvas{width:100%;height:100%;padding:80px;display:flex;flex-direction:column;justify-content:center;position:relative}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;display:none}.photo[src]:not([src=""]){display:block}.canvas>.eyebrow,.canvas>.bar,.canvas>h1,.canvas>p{position:relative}.eyebrow{font-size:34px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{font:700 clamp(72px,9.8vw,112px)/1.02 var(--display),Georgia,serif;max-width:900px;max-height:none;overflow:visible;margin:28px 0}p{font-size:46px;line-height:1.22;max-width:900px}.bar{width:110px;height:9px;background:var(--accent);margin:12px 0 24px}.cta{display:inline-block;align-self:flex-start;position:relative;margin-top:24px;background:var(--accent);color:var(--ink);padding:18px 28px;border:2px solid var(--accent);border-radius:14px;font:700 38px/1.2 var(--body),Arial,sans-serif;max-width:900px}
</style></head><body><main class="canvas" data-layout-box="0.08,0.08,0.84,0.78"><img class="photo" src="{{IMAGE_SRC}}" alt=""><div class="eyebrow">{{BRAND}}</div><div class="bar"></div><h1>{{HOOK}}</h1><p>{{BODY}}</p><div class="cta">{{CTA}}</div></main></body></html>
