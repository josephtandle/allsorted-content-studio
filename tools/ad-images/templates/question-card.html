<!doctype html><html><head><meta charset="utf-8"><style>:root{--paper:{{BACKGROUND}};--ink:{{INK}};--accent:{{ACCENT}};--display:{{DISPLAY_FONT}};--body:{{BODY_FONT}};--w:1080px;--h:1080px}*{box-sizing:border-box}html,body{margin:0;width:var(--w);height:var(--h);overflow:hidden}body{background:var(--accent);color:var(--ink);font-family:var(--body),Arial,sans-serif}.canvas{height:100%;padding:80px;display:flex;flex-direction:column;justify-content:center}.label{font-size:34px;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(72px,9.5vw,108px)/1.05 var(--display),Georgia,serif;max-height:none;overflow:visible;margin:28px 0}p{font-size:46px;line-height:1.35}.brand{margin-top:30px;font-size:40px}.cta{display:inline-block;align-self:flex-start;position:relative;margin-top:24px;background:var(--accent);color:var(--ink);padding:18px 28px;border:2px solid var(--accent);border-radius:14px;font:700 38px/1.2 var(--body),Arial,sans-serif;max-width:900px}
</style></head><body><main class="canvas" data-layout-box="0.10,0.10,0.80,0.78"><div class="label">{{BRAND}}</div><h1>{{HOOK}}</h1><p>{{BODY}}</p><div class="cta">{{CTA}}</div></main></body></html>
