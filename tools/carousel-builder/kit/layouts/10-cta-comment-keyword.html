<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Call to action</title>
<!-- Call to action: the last slide. One action and one word (comment a keyword, then reply with the promised thing).
     For a "Found this useful? Save it" ending, set lead, keyword and promise to match. The keyword is the accent.
     photo falls back to the brand portrait, byline and logo to the brand byline and logo: this is the only slide
     that shows them. With none of those set, the slide is the three lines alone. -->
<script type="application/json" id="content">
{
  "slide": 8,
  "total": 8,
  "photo": "../../assets/placeholder-portrait.svg",
  "lead": "Comment",
  "headline": "Start with a welcoming class",
  "keyword": "BOOK",
  "promise": "Choose a time that works for you.",
  "byline": "**Riverbend Bakery** \u00b7 Fresh every morning",
  "logo": "../../assets/placeholder-logo.svg"
}
</script>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  .cta { gap: var(--s-3); align-items: flex-start; }
  .cta .avatar { width: calc(176px * var(--k)); height: calc(176px * var(--k)); margin-bottom: var(--s-2); }
  .lead { font-size: var(--t-label); line-height: 1.2; }
  .headline { font: 700 var(--t-h2)/1.08 var(--font-display); max-width: var(--measure); }
  .kw { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; padding: .3em .5em .32em; border-radius: .2em; background: var(--accent); color: var(--cta-text, var(--bg));
        font-family: var(--font-body); font-size: var(--t-h3); font-weight: 700; letter-spacing: 0; line-height: 1.15; text-align: center; white-space: normal; }
  .promise { font-size: var(--t-body); line-height: 1.35; max-width: var(--measure); }
  .sig { flex: none; display: flex; align-items: center; gap: 16px; padding-top: var(--s-3); }
  .sig:not(:has(> :not(.is-empty))) { display: none; }
  .sig img { width: 44px; height: 44px; flex: none; object-fit: contain; }
  .sig span { font-size: 24px; font-weight: 600; color: var(--text-70); white-space: nowrap; }
  .sig strong { color: var(--text); font-weight: 800; }
  .sig em { font-style: normal; color: inherit; }
</style>
</head>
<body>
<main class="slide is-deep">
  <section class="stage">
    <div class="block cta" data-fit-box id="cta">
      <div class="avatar" data-src="photo" data-decor role="img" aria-label="Portrait"></div>
      <p class="eyebrow lead" data-field="lead" data-fit></p>
      <h2 class="headline" data-field="headline" data-fit></h2>
      <div class="kw" data-field="keyword" data-fit data-fit-line></div>
      <p class="body promise" data-field="promise" data-fit></p>
    </div>
    <div class="sig"><img data-src="logo" alt=""><span data-field="byline"></span></div>
  </section>
</main>
<script src="../kit.js"></script>
</body></html>
